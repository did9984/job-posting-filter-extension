<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Job Posting Analysis Assistant</title>
    <style>
        body {
            width: 440px;
            padding: 16px;
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
            background: #f9fafb;
            color: #111827;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px;
        }

        p {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: white;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        #scanBtn {
            background: #e5e7eb;
            color: #111827;
        }

        #startBtn {
            background: #2563eb;
            color: white;
        }

        #startCautionBtn {
            background: #f97316;
            color: white;
        }

        #stopBtn {
            background: #ef4444;
            color: white;
        }

        #status {
            margin-top: 12px;
            font-size: 13px;
            color: #374151;
            white-space: pre-line;
        }

        #preview {
            margin-top: 14px;
            max-height: 560px;
            overflow-y: auto;
            font-size: 12px;
        }

        .preview-section-title {
            margin-top: 12px;
            font-weight: 900;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 6px;
            line-height: 1.6;
        }

        .preview-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
        }

        .preview-title {
            font-weight: 800;
            color: #111827;
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .preview-score {
            color: #2563eb;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .preview-decision {
            font-weight: 900;
            margin-bottom: 6px;
        }

        .preview-confidence {
            font-weight: 700;
            margin-bottom: 6px;
            color: #4b5563;
            line-height: 1.5;
        }

        .preview-risk {
            margin-top: 6px;
            padding: 7px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            line-height: 1.6;
        }

        .hide_safe {
            color: #dc2626;
        }

        .hide_caution {
            color: #ea580c;
        }

        .review {
            color: #d97706;
        }

        .keep {
            color: #059669;
        }

        .small-note {
            margin-top: 8px;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.5;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
        }

        .checkbox-label input {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

<h1>Job Posting Analysis Assistant v5.2</h1>

<p>
    求人情報を HIDE_SAFE / HIDE_CAUTION / REVIEW / KEEP に分類します。<br>
    en-hyoubanなどの公開情報を参考に、評価・口コミ数・社員数を最大30件まで表示します。
</p>

<label for="filterModeSelect">フィルター強度</label>
<select id="filterModeSelect">
    <option value="conservative">保守的 - 確実な求人のみ候補にする</option>
    <option value="normal" selected>通常 - 推奨設定</option>
    <option value="aggressive">積極的 - 判断が難しい求人も候補にする</option>
</select>

<label for="viewModeSelect">表示グループ</label>
<select id="viewModeSelect">
    <option value="all" selected>すべて表示</option>
    <option value="hide_safe">HIDE_SAFEのみ表示</option>
    <option value="hide_caution">HIDE_CAUTIONのみ表示</option>
    <option value="review">REVIEWのみ表示</option>
    <option value="keep">KEEPのみ表示</option>
</select>

<label for="maxActionCountSelect">ユーザー確認に基づく処理件数</label>
<select id="maxActionCountSelect">
    <option value="5">5件のみ処理</option>
    <option value="10" selected>10件のみ処理</option>
    <option value="20">20件のみ処理</option>
    <option value="9999">すべて処理</option>
</select>

<label class="checkbox-label">
    <input type="checkbox" id="userConfirmedActionDuringAnalysisCheckbox">
    分析中に HIDE_SAFE 候補をユーザー確認基準で「興味なし」処理する
</label>

<div class="small-note">
    基準: 評価3.0以下 / 社員数80名以下 / 開発キャリアとの関連性が低い求人
</div>

<button id="scanBtn">分析する</button>
<button id="startBtn">HIDE_SAFE候補をユーザー確認処理</button>
<button id="startCautionBtn">HIDE_CAUTION候補もユーザー確認処理</button>
<button id="stopBtn">停止</button>

<div id="status">待機中</div>
<div id="preview"></div>

<script src="popup.js"></script>
</body>
</html>
